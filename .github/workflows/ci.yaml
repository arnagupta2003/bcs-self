name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docker_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test admin backend
        run: python -m unittest discover -s tests -v
      - name: Check admin frontend syntax
        run: node --check admin_ui/app.js
      - name: Build Docker image
        run: docker build --tag bombsquad-server:ci .
